services:
  backend:
    image: anhquan279205/mern-backend:1.0
    container_name: mern-backend
    ports:
      - "5000:5000"
    env_file:
      - ./mern-demo/.env

  frontend:
    image: anhquan279205/mern-frontend:2.0
    container_name: mern-frontend
    ports:
      - "8000:80"
    depends_on:
      - backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
      